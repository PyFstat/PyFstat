name: Conda Upstream Package Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '42 7 * * 1'

jobs:
  conda-upstream-test:
    name: conda upstream package test
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: "3.14"
          channels: conda-forge
          channel-priority: true
          activate-environment: pyfstat
          environment-file: etc/pyfstat.yml
          auto-activate-base: false
      - name: check conda
        shell: bash -l {0}
        run: |
          conda info
          conda list
          conda config --show-sources
          conda config --show
          printenv | sort
          conda install --yes pytest pytest-cov flaky nbmake
      - name: test with pytest
        shell: bash -l {0}
        run: |
          (cd .. && pytest --durations=0 $GITHUB_WORKSPACE/tests/ --log-file=$GITHUB_WORKSPACE/tests.log)
